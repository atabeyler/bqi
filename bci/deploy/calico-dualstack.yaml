apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  calicoNetwork:
    bgp: Enabled
    ipPools:
      - blockSize: 26
        cidr: 10.244.0.0/16
        encapsulation: VXLAN
        natOutgoing: Enabled
        nodeSelector: all()
      - blockSize: 122
        cidr: fd00:10:244::/56
        encapsulation: None
        natOutgoing: Disabled
        nodeSelector: all()
