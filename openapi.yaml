openapi: 3.1.0
info:
  title: BQI API
  version: 2.1.114
  description: Versioned institutional/platform API surface for BQI.
servers:
  - url: /api/v1
paths:
  /platform/health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
  /platform/health/ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Core services are ready
        '503':
          description: A required core service is unavailable
  /platform/models:
    get:
      summary: Model registry and analysis prompt version
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Public model registry and prompt version
  /platform/connectors:
    get:
      summary: Registered institutional connector status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connector registry and health state
        '403':
          description: Administrator access required
  /platform/metrics:
    get:
      summary: In-process request latency and error metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Request metrics snapshot
        '403':
          description: Administrator access required
  /platform/retention:
    get:
      summary: Decision-record retention policy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current decision retention configuration
        '403':
          description: Administrator access required
  /platform/overview:
    get:
      summary: Administrative operational overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Health, connector, decision, risk and metrics overview
        '403':
          description: Administrator access required
  /platform/risk:
    get:
      summary: Recent risk-oriented analyses and fraud flag rates
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Recent risk overview
        '403':
          description: Administrator access required
  /platform/decisions/{analysisId}:
    get:
      summary: Read the decision trace for an analysis
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: analysisId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Decision provenance, evidence and trace
        '404':
          description: Decision trace not found or not accessible
  /platform/decisions/{analysisId}/outcome:
    post:
      summary: Record the observed outcome of a prior decision-support analysis
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: analysisId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Outcome recorded
        '400':
          description: Outcome information is required
        '404':
          description: Decision trace not found or not accessible
  /platform/decisions/{analysisId}/replay:
    post:
      summary: Re-run a stored analysis request through the current analysis pipeline
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: analysisId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Replay result
        '404':
          description: Replayable analysis not found
        '502':
          description: Analysis replay failed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
