<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9e5ee"/>
      <stop offset="1" stop-color="#8195a8"/>
    </linearGradient>
    <filter id="cyanGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Adaptive launcher masks retain roughly the inner two thirds. -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <circle cx="256" cy="250" r="174" fill="none" stroke="#20d8ff" stroke-width="6" opacity="0.86" filter="url(#cyanGlow)"/>
    <circle cx="256" cy="250" r="143" fill="none" stroke="#65e8ff" stroke-width="3" opacity="0.4"/>
    <ellipse cx="256" cy="250" rx="196" ry="72" fill="none" stroke="#2fdcff" stroke-width="6" opacity="0.88" transform="rotate(-18 256 250)"/>
    <ellipse cx="256" cy="250" rx="196" ry="72" fill="none" stroke="#238de9" stroke-width="5" opacity="0.72" transform="rotate(58 256 250)"/>
    <g fill="#67e9ff" filter="url(#cyanGlow)">
      <circle cx="92" cy="309" r="10"/>
      <circle cx="366" cy="112" r="10"/>
      <circle cx="404" cy="330" r="10"/>
      <circle cx="256" cy="76" r="9"/>
    </g>
    <text x="256" y="293" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="158" font-weight="900" letter-spacing="-9" fill="url(#metal)" stroke="#07172b" stroke-width="9" paint-order="stroke" filter="url(#cyanGlow)">BQI</text>
    <path d="M145 336h222" stroke="#68eaff" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>
